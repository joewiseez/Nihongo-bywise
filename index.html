  --bg:#0a0817; --card:#15112b; --text:#fbfbfe; --muted:#a8a3c9;
  --accent:#6a63ff; --accent2:#574fe0; --border:#2c264f; --good:#6fcf9b;
}
*{box-sizing:border-box;}
#top-loader{position:fixed;top:0;left:0;height:3px;width:0%;background:var(--accent);z-index:1000;opacity:0;transition:width 0.4s ease,opacity 0.3s ease;}
#top-loader.active{opacity:1;}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,0.5);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;margin-right:6px;vertical-align:-1px;}
@keyframes spin{to{transform:rotate(360deg);}}
#topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);max-width:480px;margin:0 auto;}
#topbar img{width:32px;height:32px;flex-shrink:0;}
#topbar-title{font-weight:700;font-size:1.15em;color:var(--text);}
#topbar-title b{color:var(--accent);font-weight:700;}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic Pro","Yu Gothic",-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 90px;}
h1,h2,h3{margin:0 0 8px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.jp{font-size:1.6em;font-weight:600;}
.muted{color:var(--muted);font-size:0.9em;}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-size:1em;cursor:pointer;width:100%;margin-top:8px;}
.btn.secondary{background:var(--accent2);}
.btn.outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.row{display:flex;gap:8px;}
.row>*{flex:1;}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--border);font-size:0.8em;margin:2px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.kana-tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;}
.kana-tile .jp{font-size:1.8em;}
.progress-bar{height:10px;background:var(--border);border-radius:6px;overflow:hidden;margin:6px 0;}
.progress-fill{height:100%;background:var(--good);}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;max-width:480px;margin:0 auto;}
nav button{flex:1;background:none;border:none;padding:10px 4px 8px;font-size:0.75em;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
nav button svg{transition:color 0.15s;}
nav button .nav-dot{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:1px;}
nav button.active{color:var(--accent);font-weight:600;}
nav button.active .nav-dot{background:var(--accent);}
.flash{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px 16px;text-align:center;min-height:140px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;}
.hidden{display:none !important;}
.opt-btn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;color:var(--text);font-size:1em;}
.opt-btn.correct{background:var(--good);color:#fff;border-color:var(--good);}
.opt-btn.wrong{background:var(--accent);color:#fff;border-color:var(--accent);}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.vocab-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--border);cursor:pointer;gap:10px;}
.vocab-row-main{flex:1;min-width:0;}
.vocab-row-title{font-weight:600;font-size:1.05em;}
.speak-icon{user-select:none;-webkit-user-select:none;touch-action:manipulation;padding:2px 4px;display:inline-block;}
.vocab-row-title .speak-icon{margin-left:4px;cursor:pointer;}
.vocab-row-detail{margin-top:6px;}
.vocab-row-detail .pill{font-size:0.72em;}
.vocab-row-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.bars{display:flex;align-items:flex-end;gap:2px;height:16px;}
.bars span{width:4px;background:var(--border);border-radius:2px;}
.bars span:nth-child(1){height:6px;}
.bars span:nth-child(2){height:11px;}
.bars span:nth-child(3){height:16px;}
.bars-mid span:nth-child(1){background:var(--accent);}
.bars-full span{background:var(--good);}
.chevron{color:var(--muted);transition:transform 0.2s;}
.chevron.open{transform:rotate(180deg);}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:6px;}
.tab-btn{flex:1;background:none;border:none;padding:10px 4px;font-size:0.85em;letter-spacing:0.3px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;text-transform:uppercase;font-weight:600;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.vocab-row{padding:12px 2px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer;}
.vocab-main{flex:1;min-width:0;}
.vocab-title{font-weight:600;font-size:1.02em;}
.vocab-sub{color:var(--muted);font-size:0.88em;margin-top:2px;}
.vocab-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.bars{display:flex;align-items:flex-end;gap:2px;height:16px;}
.bars div{width:4px;border-radius:2px;background:var(--border);}
.bars div:nth-child(1){height:6px;}
.bars div:nth-child(2){height:10px;}
.bars div:nth-child(3){height:13px;}
.bars div:nth-child(4){height:16px;}
.bars.mastered div{background:var(--accent);}
.bars.seen div:nth-child(1){background:#e05a4e;}
.chevron{color:var(--muted);font-size:1em;padding:4px;transition:transform 0.15s;}
.chevron.open{transform:rotate(180deg);}
.vocab-detail{padding:0 2px 10px;color:var(--muted);font-size:0.85em;}
.stat-row{display:flex;gap:8px;margin-bottom:12px;}
.stat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 4px;text-align:center;}
.stat-box.streak-box{background:linear-gradient(160deg,#fff4e6,#ffe8d6);border:1px solid #ffcf9e;}
.stat-box.streak-box .stat-num{color:#e0621a;font-size:1.6em;}
.stat-box.streak-box .flame-icon{font-size:1.3em;line-height:1;margin-bottom:2px;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .stat-box.streak-box{background:linear-gradient(160deg,#3a2412,#2a1a0d);border-color:#7a4a1e;}
}
:root[data-theme="dark"] .stat-box.streak-box{background:linear-gradient(160deg,#3a2412,#2a1a0d);border-color:#7a4a1e;}
.stat-num{font-size:1.4em;font-weight:700;color:var(--text);}
.level-box{background:var(--accent2);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px;}
.level-box .muted{color:#cfe0f7;font-size:0.85em;}
.level-box .progress-bar{background:rgba(255,255,255,0.25);}
.level-box .progress-fill{background:#ffffff;}
.week-chart{display:flex;justify-content:space-between;align-items:flex-end;height:80px;gap:4px;}
.week-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
.week-bar{width:60%;background:var(--border);border-radius:6px 6px 2px 2px;min-height:6px;}
.week-bar.today{background:var(--accent);}
.belajar-card{display:flex;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;align-items:center;}
.belajar-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3em;font-weight:700;flex-shrink:0;}
.skill-path{position:relative;padding:10px 0 20px;}
.skill-path::before{content:"";position:absolute;left:50%;top:6px;bottom:26px;width:0;border-left:4px dashed var(--border);transform:translateX(-50%);z-index:0;}
.skill-node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:118px;margin:0 auto 30px;cursor:pointer;text-align:center;}
.skill-badge{position:absolute;top:-14px;background:var(--accent);color:#fff;font-size:0.68em;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.15);}
.skill-ring{width:84px;height:84px;border-radius:50%;padding:6px;display:flex;align-items:center;justify-content:center;transition:background 0.3s;}
.skill-ring.current{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--accent);}
.skill-ring-inner{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.9em;font-weight:700;background:var(--card);}
.skill-label{margin-top:8px;font-weight:700;font-size:0.95em;}
.skill-sub{color:var(--muted);font-size:0.78em;margin-top:2px;}
.total-ring{width:76px;height:76px;border-radius:50%;padding:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.total-ring-inner{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;}
@keyframes confetti-fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(360deg);opacity:0;}
}
@keyframes pop-anim{
  0%{transform:scale(1);}
  40%{transform:scale(1.06);}
  100%{transform:scale(1);}
}
@keyframes shake-anim{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-6px);}
  40%{transform:translateX(6px);}
  60%{transform:translateX(-4px);}
  80%{transform:translateX(4px);}
}
.opt-btn.pop{animation:pop-anim 0.35s ease;}
.opt-btn.shake{animation:shake-anim 0.35s ease;}
.empty-good{background:linear-gradient(135deg,rgba(47,158,110,0.08),rgba(47,158,110,0.02));border-color:rgba(47,158,110,0.35)!important;}
.latihan-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--card),var(--border));border-radius:18px;padding:18px;margin-bottom:14px;border:1px solid var(--border);}
.latihan-hero-deco{position:absolute;top:10px;right:10px;font-size:2.4em;opacity:0.5;filter:blur(0.2px);}
.latihan-progress-bar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px;}
.latihan-card{border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
.latihan-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4em;font-weight:700;color:#fff;}
.latihan-chevron{width:32px;height:32px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:1.2em;color:var(--text);cursor:pointer;flex-shrink:0;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .latihan-card{background:var(--card)!important;border-color:var(--border)!important;}
  :root:not([data-theme="light"]) .latihan-hero-deco{opacity:0.25;}
}
:root[data-theme="dark"] .latihan-card{background:var(--card)!important;border-color:var(--border)!important;}
:root[data-theme="dark"] .latihan-hero-deco{opacity:0.25;}
.back-link{display:inline-block;color:var(--accent);margin-bottom:10px;cursor:pointer;font-size:0.9em;}
.chat-line{max-width:82%;padding:10px 14px;border-radius:14px;margin-bottom:12px;}
.chat-line.a{background:var(--card);border:1px solid var(--border);margin-right:auto;border-bottom-left-radius:3px;}
.chat-line.b{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:3px;}
.chat-line .muted{font-size:0.82em;margin-top:3px;}
.chat-line.b .muted{color:#dfeaff;}
</style>

function applyTheme(mode){
  if(mode === 'light' || mode === 'dark'){
    document.documentElement.setAttribute('data-theme', mode);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
}
function getTheme(){
  try{ return localStorage.getItem('nihongo_theme') || 'system'; }catch(e){ return 'system'; }
}
function setTheme(mode){
  try{ localStorage.setItem('nihongo_theme', mode); }catch(e){}
  applyTheme(mode);
}

const DIGIT_KANJI = ['','一','二','三','四','五','六','七','八','九'];
const DIGIT_RO = ['','ichi','ni','san','yon','go','roku','nana','hachi','kyuu'];
function buildNumber(n){
  if(n === 100) return {num:100, kanji:'百', ro:'hyaku'};
  const tens = Math.floor(n/10), ones = n%10;
  let kanji = '', ro = '';
  if(tens > 0){
    if(tens === 1){ kanji += '十'; ro += 'juu'; }
    else { kanji += DIGIT_KANJI[tens] + '十'; ro += DIGIT_RO[tens] + 'juu'; }
  }
  if(ones > 0){ kanji += DIGIT_KANJI[ones]; ro += DIGIT_RO[ones]; }
  return {num:n, kanji, ro};
}
const NUMBERS = Array.from({length:100}, (_, i) => buildNumber(i+1));

// ---------- state ----------
function load(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} syncCloud(); }

function syncCloud(){
  if(!currentUid) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async ()=>{
    try{ await setDoc(doc(db, 'users', currentUid), { stats, profile }, { merge:true }); }
    catch(e){ console.error('Gagal sync ke cloud:', e); }
  }, 800);
}
async function loadCloudData(uid){
  currentUid = uid;
  try{
    const snap = await getDoc(doc(db, 'users', uid));
    if(snap.exists()){
      const cloud = snap.data();
      if(cloud.stats) stats = cloud.stats;
      if(cloud.profile) profile = cloud.profile;
    }
  }catch(e){ console.error('Gagal ambil data dari cloud:', e); }
}
function showLoader(){
  const el = document.getElementById('top-loader');
  if(!el) return;
  el.classList.add('active');
  el.style.width = '0%';
  requestAnimationFrame(()=>{ el.style.width = '75%'; });
}
function hideLoader(){
  const el = document.getElementById('top-loader');
  if(!el) return;
  el.style.width = '100%';
  setTimeout(()=>{
    el.classList.remove('active');
    setTimeout(()=>{ el.style.width = '0%'; }, 300);
  }, 200);
}

async function completeEmailLinkSignIn(){
  if(isSignInWithEmailLink(auth, window.location.href)){
    let email = window.localStorage.getItem('nihongo_login_email');
    if(!email){ email = window.prompt('Masukkan email yang kamu pakai untuk login:'); }
    if(email){
      showLoader();
      try{
        await signInWithEmailLink(auth, email, window.location.href);
        window.localStorage.removeItem('nihongo_login_email');
        window.history.replaceState({}, document.title, window.location.pathname);
      }catch(e){ alert('Login gagal: ' + e.message); }
      finally{ hideLoader(); }
    }
  }
}

function todayStr(){ return new Date().toDateString(); }
function checkStreak(){
  const t = todayStr();
  if(stats.lastDate === t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  if(stats.lastDate === y.toDateString()) stats.streak += 1; else stats.streak = 1;
  stats.lastDate = t;
  if(stats.streak > (stats.bestStreak||0)) stats.bestStreak = stats.streak;
  save('nihongo_stats', stats);
}
function addXp(n){ stats.xp += n; save('nihongo_stats', stats); }
function recordActivity(xpGain){
  const t = todayStr();
  if(stats.todayDate !== t){ stats.todayDate = t; stats.todayCount = 0; }
  stats.todayCount += 1;
  stats.dailyXp[t] = (stats.dailyXp[t]||0) + xpGain;
  save('nihongo_stats', stats);
}
function getWeekData(){
  const days = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  const now = new Date();
  const start = new Date(now); start.setDate(now.getDate() - now.getDay());
  const t = todayStr();
  const out = [];
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = d.toDateString();
    out.push({label:days[i], xp: stats.dailyXp[key]||0, isToday: key===t});
  }
  return out;
}
let ttsVoices = [];
let ttsWarnedOnce = false;
function loadTtsVoices(){
  try{ ttsVoices = speechSynthesis.getVoices() || []; }catch(e){ ttsVoices = []; }
}
if('speechSynthesis' in window){
  loadTtsVoices();
  speechSynthesis.onvoiceschanged = loadTtsVoices;
}
function speak(text){
  try{
    if(!('speechSynthesis' in window)){
      if(!ttsWarnedOnce){ ttsWarnedOnce = true; alert('Browser ini tidak mendukung text-to-speech. Coba pakai Chrome terbaru.'); }
      return;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    const jaVoice = ttsVoices.find(v => v.lang && v.lang.toLowerCase().startsWith('ja'));
    if(jaVoice) u.voice = jaVoice;
    else if(ttsVoices.length && !ttsWarnedOnce){
      ttsWarnedOnce = true;
      alert('HP kamu belum punya suara Bahasa Jepang untuk text-to-speech. Coba install/aktifkan "Google Text-to-Speech" + paket bahasa Jepang lewat Setelan HP > Sistem > Bahasa & Input > Text-to-speech.');
    }
    speechSynthesis.speak(u);
  }catch(e){}
}

const LEVEL_XP = 1000;
function levelInfo(xp){
  const level = Math.floor(xp / LEVEL_XP) + 1;
  const cur = xp % LEVEL_XP;
  return {level, cur, need: LEVEL_XP};
}
function weakestCategory(){
  const kanaTotal = HIRAGANA.length + HIRAGANA_DAKUTEN.length + HIRAGANA_YOON.length;
  const kataTotal = KATAKANA.length + KATAKANA_DAKUTEN.length + KATAKANA_YOON.length;
  const cats = [
    {tab:'kana', mode:'hiragana', label:'Hiragana', done:Object.keys(stats.kanaKnown).length, total:kanaTotal},
    {tab:'kana', mode:'katakana', label:'Katakana', done:Object.keys(stats.katakanaKnown).length, total:kataTotal},
    {tab:'vocab', label:'Kosakata', done:Object.keys(stats.vocabMastered).length, total:VOCAB.length},
    {tab:'kanji', label:'Kanji', done:Object.keys(stats.kanjiKnown).length, total:KANJI.length},
    {tab:'numbers', label:'Angka', done:Object.keys(stats.numberKnown).length, total:NUMBERS.length},
    {tab:'conversations', label:'Percakapan', done:Object.keys(stats.conversationKnown).length, total:CONVERSATIONS.length},
    {tab:'grammar', label:'Tata Bahasa', done:Object.keys(stats.grammarMastered).length, total:GRAMMAR.length},
  ];
  cats.forEach(c=>c.ratio = c.done/c.total);
  cats.sort((a,b)=>a.ratio-b.ratio);
  return cats[0];
}
function reviewCount(){
  const v = VOCAB.filter(w=>stats.vocabSeen[w.jp] && !stats.vocabMastered[w.jp]).length;
  const g = GRAMMAR.filter(x=>stats.grammarSeen[x.pattern] && !stats.grammarMastered[x.pattern]).length;
  return v+g;
}
function startReviewQuiz(){
  const vItems = VOCAB.filter(w=>stats.vocabSeen[w.jp] && !stats.vocabMastered[w.jp]).map(w=>({q:w.jp,a:w.id,opts:'vocab',key:w.jp,track:'vocab'}));
  const gItems = GRAMMAR.filter(x=>stats.grammarSeen[x.pattern] && !stats.grammarMastered[x.pattern]).map(x=>({q:x.pattern,a:x.meaning,opts:'grammar',key:x.pattern,track:'grammar'}));
  const items = shuffleArr([...vItems, ...gItems]);
  if(items.length === 0){ alert('Belum ada yang perlu diulas. Coba kuis biasa dulu, ya!'); return; }
  runQuiz(items, 'Ulasan');
}
function progressLine(label, done, total){
  return `<div class="row" style="width:100%;justify-content:space-between;margin-bottom:2px"><span class="muted">${label}</span><span class="muted" style="text-align:right;white-space:nowrap">${done}/${total}</span></div>

}

function startGrammarQuiz(){
  let available = GRAMMAR.filter(g=>!stats.grammarMastered[g.pattern]);
  const pool = available.length ? available : GRAMMAR;
  const unseen = shuffleArr(pool.filter(g=>!stats.grammarSeen[g.pattern]));
  const seenNotMastered = shuffleArr(pool.filter(g=>stats.grammarSeen[g.pattern]));
  const ordered = [...unseen, ...seenNotMastered];
  const chosen = ordered.slice(0, Math.min(20, GRAMMAR.length));
  const items = chosen.map(g=>({q:g.pattern, a:g.meaning, opts:'grammar', key:g.pattern, track:'grammar'}));
  runQuiz(items, 'Grammar');
}

        <div class="vocab-row-title">${w.ro} / ${w.jp} <span class="speak-icon" data-jp="${w.jp}">🔊</span></div>
        <div class="muted">${w.id}</div>
        <div class="vocab-row-detail hidden">
          <span class="pill">${w.cat}</span><span class="pill">${w.lvl}</span>
          <span class="pill">${mastered ? '✓ Dikuasai' : seen ? 'Pernah muncul' : 'Belum dikuis'}</span>
        </div>
      </div>
      <div class="vocab-row-right">
        <div class="bars ${barClass}"><span></span><span></span><span></span></div>
        <div class="chevron">⌄</div>
      </div>
    </div>`;
  }).join('');
  listEl.querySelectorAll('.speak-icon').forEach(s=>{
    s.onclick = (e)=>{ e.stopPropagation(); speak(s.dataset.jp); };
  });
  listEl.querySelectorAll('.vocab-row').forEach(row=>{
    row.onclick = ()=>{
      const detail = row.querySelector('.vocab-row-detail');
      const chev = row.querySelector('.chevron');
      detail.classList.toggle('hidden');
      chev.classList.toggle('open');
    };
  });
}

function shuffleArr(a){ return a.slice().sort(()=>Math.random()-0.5); }

function startVocabQuiz(level){
  level = level || 'all';
  const set = level === 'all' ? VOCAB : VOCAB.filter(w=>w.lvl===level);
  let available = set.filter(w=>!stats.vocabMastered[w.jp]);
  const pool = available.length ? available : set; // semua sudah dikuasai -> ulangi dari awal
  const unseen = shuffleArr(pool.filter(w=>!stats.vocabSeen[w.jp]));
  const seenNotMastered = shuffleArr(pool.filter(w=>stats.vocabSeen[w.jp]));
  let ordered = [...unseen, ...seenNotMastered];
  if(ordered.length < Math.min(20, set.length)){
    const masteredPool = shuffleArr(set.filter(w=>stats.vocabMastered[w.jp]));
    ordered = ordered.concat(masteredPool);
  }
  const chosen = ordered.slice(0, Math.min(20, set.length));
  const items = chosen.map(w=>({q:w.jp, a:w.id, opts:'vocab', key:w.jp, track:'vocab'}));
  runQuiz(items, 'Kosakata ' + (level==='all'?'Semua':level));
}

function startMixedQuiz(){
  const pool = [
    ...HIRAGANA.map(([jp,ro])=>({q:jp,a:ro,opts:'kana'})),
    ...KATAKANA.map(([jp,ro])=>({q:jp,a:ro,opts:'katakana'})),
    ...HIRAGANA_DAKUTEN.map(([jp,ro])=>({q:jp,a:ro,opts:'kana-ext'})),
    ...HIRAGANA_YOON.map(([jp,ro])=>({q:jp,a:ro,opts:'kana-ext'})),
    ...KATAKANA_DAKUTEN.map(([jp,ro])=>({q:jp,a:ro,opts:'katakana-ext'})),
    ...KATAKANA_YOON.map(([jp,ro])=>({q:jp,a:ro,opts:'katakana-ext'})),
    ...VOCAB.map(w=>({q:w.jp,a:w.id,opts:'vocab',key:w.jp,track:'vocab'})),
    ...KANJI.map(item=>({q:item.k,a:item.mean,opts:'kanji'})),
    ...NUMBERS.map(n=>({q:n.kanji,a:n.ro,opts:'number'})),
    ...CONVERSATIONS.flatMap(c=>c.lines.map(l=>({q:l.jp,a:l.id,opts:'conversation'}))),
    ...GRAMMAR.map(g=>({q:g.pattern,a:g.meaning,opts:'grammar',key:g.pattern,track:'grammar'})),
  ];
  runQuiz(pool.sort(()=>Math.random()-0.5).slice(0,20), 'Campuran');
}

function fireConfetti(){
  const colors = ['#433bff','#f59e0b','#22c55e','#ef4444','#3b82f6','#fb7185'];
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;';
  document.body.appendChild(wrap);
  for(let i=0;i<28;i++){
    const p = document.createElement('div');
    const size = 6 + Math.random()*6;
    const left = 10 + Math.random()*80;
    const dur = 1.4 + Math.random()*1;
    const delay = Math.random()*0.3;
    const rot = Math.random()*360;
    p.style.cssText = `position:absolute;top:-10px;left:${left}%;width:${size}px;height:${size*1.4}px;background:${colors[i%colors.length]};opacity:0.9;border-radius:2px;transform:rotate(${rot}deg);animation:confetti-fall ${dur}s ease-in ${delay}s forwards;`;
    wrap.appendChild(p);
  }
  setTimeout(()=> wrap.remove(), 2800);
}

function runQuiz(items, title){
  items = items.slice().sort(()=>Math.random()-0.5).slice(0, Math.min(20, items.length));
  let idx=0, correct=0;
  function pool(kind){
    if(kind==='kana') return HIRAGANA.map(h=>h[1]);
    if(kind==='katakana') return KATAKANA.map(h=>h[1]);
    if(kind==='kana-ext') return [...HIRAGANA_DAKUTEN, ...HIRAGANA_YOON].map(h=>h[1]);
    if(kind==='katakana-ext') return [...KATAKANA_DAKUTEN, ...KATAKANA_YOON].map(h=>h[1]);
    if(kind==='kanji') return KANJI.map(k=>k.mean);
    if(kind==='grammar') return GRAMMAR.map(g=>g.meaning);
    if(kind==='number') return NUMBERS.map(n=>n.ro);
    if(kind==='conversation') return CONVERSATIONS.flatMap(c=>c.lines.map(l=>l.id));
    return VOCAB.map(v=>v.id);
  }
  function draw(){
    if(idx >= items.length){
      const xpGain = correct*5;
      addXp(xpGain); checkStreak(); recordActivity(xpGain);
      const ratio = correct/items.length;
      app.innerHTML = `<div class="card" style="text-align:center">
        <h2>${ratio>=0.8?'Mantap! 🎉':ratio>=0.5?'Selesai! 👍':'Selesai 🙂'}</h2>
        <p>Benar: ${correct}/${items.length}</p>
        <p class="muted">+${xpGain} XP</p>
        <button class="btn" onclick="goto('home')">Kembali ke Home</button>
      </div>`;
      if(ratio>=0.5) fireConfetti();
      return;
    }
    const it = items[idx];
    const wrongPool = pool(it.opts).filter(x=>x!==it.a);
    const opts = [it.a, ...wrongPool.sort(()=>Math.random()-0.5).slice(0,3)].sort(()=>Math.random()-0.5);
    app.innerHTML = `
      <div class="top"><span class="muted">${title} ${idx+1}/${items.length}</span><span class="pill">✓ ${correct}</span></div>
      <div class="card" style="text-align:center"><div class="jp" style="font-size:${it.q.length>12?'0.95':it.q.length>6?'1.3':'2.2'}em">${it.q}</div></div>
      <div id="opts"></div>`;
    const optsEl = $('#opts');
    optsEl.innerHTML = opts.map(o=>`<button class="opt-btn" data-o="${o}">${o}</button>`).join('');
    optsEl.querySelectorAll('.opt-btn').forEach(b=>{
      b.onclick = ()=>{
        optsEl.querySelectorAll('.opt-btn').forEach(x=>x.onclick=null);
        const isCorrect = b.dataset.o === it.a;
        if(isCorrect){ b.classList.add('correct','pop'); correct++; }
        else {
          b.classList.add('wrong','shake');
          optsEl.querySelectorAll('.opt-btn').forEach(x=>{ if(x.dataset.o===it.a) x.classList.add('correct'); });
        }
        if(it.track && it.key){
          const seenObj = it.track === 'vocab' ? stats.vocabSeen : stats.grammarSeen;
          const masteredObj = it.track === 'vocab' ? stats.vocabMastered : stats.grammarMastered;
          seenObj[it.key] = true;
          if(isCorrect) masteredObj[it.key] = true;
          save('nihongo_stats', stats);
        }
        setTimeout(()=>{ idx++; draw(); }, 700);
      };
    });
  }
  draw();
}

      <div class="row">

        <button class="btn ${curTheme==='light'?'':'outline'}" data-theme-opt="light" style="font-size:0.85em">☀️ Terang</button>
        <button class="btn ${curTheme==='dark'?'':'outline'}" data-theme-opt="dark" style="font-size:0.85em">🌙 Gelap</button>

    </div>
    <div class="card">
      <p>Level: <b>${profile.level}</b></p>
      <p>Tujuan: <b>${profile.goal}</b></p>

      <p>Streak saat ini: <b>${stats.streak} hari</b></p>
      <p>Streak terbaik: <b>${Math.max(stats.bestStreak||0, stats.streak)} hari</b></p>
      <p>XP total: <b>${stats.xp}</b> (Level ${levelInfo(stats.xp).level})</p>

    <div class="card">
      <h3>Ganti target</h3>
      <div class="row">
        ${[10,15,30].map(t=>`<button class="btn ${t===profile.time?'':'outline'}" data-t="${t}">${t} menit</button>`).join('')}
      </div>
    </div>
    <button class="btn outline" id="reset-btn">Reset semua progres</button>`;
  document.querySelectorAll('[data-theme-opt]').forEach(b=>{
    b.onclick = ()=>{ setTheme(b.dataset.themeOpt); renderProfile(); };
  });
  $('#login-card').innerHTML = renderLoginCard();
  if(window.fbUser){
    $('#logout-btn').onclick = async ()=>{ await window.logout(); renderProfile(); };
  } else if(window.fbReady){
    $('#login-send').onclick = async ()=>{
      const email = $('#login-email').value.trim();
      if(!email){ return; }
      $('#login-send').disabled = true;
      $('#login-send').innerHTML = '<span class="spinner"></span> Mengirim...';
      const res = await window.firebaseSendLoginLink(email);
      if(res.ok){ $('#login-msg').textContent = 'Link login sudah dikirim! Cek email kamu (termasuk folder spam), lalu ketuk link-nya.'; $('#login-send').innerHTML = 'Kirim Link Login'; }
      else { $('#login-msg').textContent = 'Gagal kirim: ' + res.error; $('#login-send').disabled = false; $('#login-send').innerHTML = 'Kirim Link Login'; }
    };
  }
  document.querySelectorAll('[data-t]').forEach(b=>{
    b.onclick = ()=>{ profile.time = Number(b.dataset.t); save('nihongo_profile', profile); renderProfile(); };
  });
  $('#reset-btn').onclick = ()=>{
    if(confirm('Hapus semua progres di browser ini?')){
      localStorage.removeItem('nihongo_stats');

      render();
    }
  };
}

function render(){
  if(!profile){ renderOnboarding(); return; }
  nav.classList.remove('hidden');
  const belajarGroup = ['kana','vocab','kanji','grammar','numbers','conversations','conversation-detail','belajar'];
  const activeTab = belajarGroup.includes(tab) ? 'belajar' : tab;
  nav.querySelectorAll('button').forEach(b=> b.classList.toggle('active', b.dataset.tab===activeTab));
  if(tab==='home') renderHome();
  else if(tab==='belajar') renderBelajar();
  else if(tab==='kana') renderKana();
  else if(tab==='vocab') renderVocab();
  else if(tab==='kanji') renderKanji();
  else if(tab==='grammar') renderGrammar();
  else if(tab==='numbers') renderNumbers();
  else if(tab==='conversations') renderConversations();
  else if(tab==='conversation-detail') renderConversationDetail();
  else if(tab==='quiz') renderQuizHub();
  else if(tab==='profile') renderProfile();
}

nav.querySelectorAll('button').forEach(b=> b.onclick = ()=> goto(b.dataset.tab));
render();
initAuth();
